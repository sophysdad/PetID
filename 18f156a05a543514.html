  }
  .photo-blur{
    position:absolute;
    inset:-30px;
    background-image:var(--photo-url);
    background-size:cover;
    background-position:center;
    filter:blur(45px) saturate(1.3) brightness(0.7);
    transform:scale(1.15);
  }
  .photo-main{
    position:absolute; inset:0;
    background-image:var(--photo-url);
    background-size:contain;
    background-position:center;
    background-repeat:no-repeat;
    filter:saturate(1.05);
  }
  .scrim{
    position:absolute; inset:0;
    background:linear-gradient(180deg,
      rgba(15,10,6,0.28) 0%,
      rgba(16,11,6,0.32) 20%,
      rgba(20,13,7,0.5) 42%,
      rgba(22,15,8,0.72) 60%,
      rgba(20,13,7,0.94) 78%,
      rgba(18,12,6,0.99) 100%);
  }
  .content{
    position:relative;
    z-index:2;
    padding: 6vh 6vw 5vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }
  .tag-hole{
    width:22px; height:22px;
    border-radius:50%;
    border:3px solid var(--brass);
    background:rgba(20,14,8,0.4);
    margin-bottom:14px;
    box-shadow:0 0 0 3px rgba(0,0,0,0.15);
  }
  .eyebrow{
    color: var(--brass);
    font-family:'Fredoka', sans-serif;
    font-weight:600;
    letter-spacing:0.16em;
    text-transform:uppercase;
    font-size:0.72rem;
    margin:0 0 6px;
    text-shadow:0 2px 8px rgba(0,0,0,0.5);
  }
  h1{
    font-family:'Fredoka', sans-serif;
    font-weight:700;
    color:var(--cream);
    font-size:clamp(2.1rem, 8vw, 2.8rem);
    margin:0 0 14px;
    line-height:1.05;
    text-shadow:0 2px 12px rgba(0,0,0,0.55);
  }
  .message{
    color:#EDE3D3;
    font-size:clamp(1rem, 4vw, 1.15rem);
    line-height:1.55;
    max-width:34ch;
    margin:0 0 28px;
    text-shadow:0 1px 6px rgba(0,0,0,0.5);
  }
  .message strong{
    color:var(--cream);
    font-weight:600;
  }
  .divider{
    width:56px; height:3px;
    background:var(--brass);
    border-radius:3px;
    margin:0 0 26px;
    opacity:0.85;
  }
  .contacts-label{
    font-family:'Fredoka', sans-serif;
    font-weight:600;
    color:var(--brass);
    font-size:0.78rem;
    letter-spacing:0.1em;
    text-transform:uppercase;
    margin:0 0 16px;
  }
  .contacts{
    display:flex;
    flex-direction:column;
    gap:12px;
    width:100%;
    max-width:360px;
  }
  .contact-btn{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    background:rgba(245,237,224,0.08);
    border:1.5px solid rgba(201,162,75,0.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border-radius:14px;
    padding:14px 18px;
    text-decoration:none;
    transition: background 0.15s ease, transform 0.15s ease;
  }
  .contact-btn:active{
    background:rgba(201,162,75,0.22);
    transform: scale(0.98);
  }
  .contact-name{
    font-family:'Fredoka', sans-serif;
    font-weight:600;
    color:var(--cream);
    font-size:1rem;
  }
  .contact-number{
    font-family:'Karla', sans-serif;
    font-weight:500;
    color:#D8C9A8;
    font-size:0.95rem;
    letter-spacing:0.02em;
  }
  .call-icon{
    flex-shrink:0;
    width:34px; height:34px;
    border-radius:50%;
    background:var(--brass);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .call-icon svg{ width:16px; height:16px; }
  .footer-note{
    margin-top:28px;
    color:rgba(216,201,168,0.55);
    font-size:0.72rem;
    letter-spacing:0.04em;
  }
  .cta-link{
    margin-top:16px;
  }
  .cta-link a{
    color:var(--brass);
    font-size:0.74rem;
    letter-spacing:0.02em;
    text-decoration:underline;
    text-decoration-color:rgba(201,162,75,0.45);
    text-underline-offset:3px;
  }
  @media (prefers-reduced-motion: no-preference){
    .content{ animation: rise 0.6s ease-out; }
  }
  @keyframes rise{
    from{ opacity:0; transform:translateY(10px); }
    to{ opacity:1; transform:translateY(0); }
  }
</style>
</head>
